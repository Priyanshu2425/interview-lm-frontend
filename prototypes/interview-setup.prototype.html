<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — setting up the interview</title>
<!--
  THROWAWAY. Three variants of the screen between pressing Begin on
  `/session/new` and the first question landing on `/examination/:sessionId`.
  ?variant=A|B|C, the bottom bar, or the arrow keys. States on the keys 1-0.

  THE QUESTION
  ------------
  Variant A of `voice-answer.prototype.html` won: the Candidate speaks, reads
  the transcript back, and sends it. But that prototype put the 60MB model
  download inside the composer, which is wrong twice over.

  Wrong once because of WHEN. The composer appears when the first question
  does, and the Session clock is already running by then. A Candidate would
  spend the first ten seconds of a timed examination watching a progress bar.
  The download belongs at Session start, before the clock, where waiting costs
  nothing.

  Wrong twice because of WHAT IT SAID. "Downloading model — 60MB" is our
  problem described in our words. Nobody sitting an interview has a view about
  a model. What they are waiting for is the interview to be ready, and that is
  what the screen should say.

  WHICH IS NOT THE SAME AS HIDING IT
  ----------------------------------
  A friendly sentence over a silent 60MB download is fine at 200Mbps and a lie
  at 2Mbps, where it becomes a spinner that never moves and no reason given.
  So every variant here: says the interview is being set up, keeps the real
  detail one glance away, and NAMES THE NETWORK the moment it is slow. The
  headline is plain language. The truth is still reachable.

  IT IS ALSO NOT ONE THING
  ------------------------
  Three real things happen at Session start, and the wait is honest because it
  is genuinely all three:

    1. The plan is fixed.        POST /v1/sessions — the server decides what
                                 will be asked, once, and never again.
    2. The microphone is asked for.  Better here than mid-question, where a
                                 permission sheet lands on top of a running clock.
    3. Speech recognition is made ready.  The 60MB, first visit only, cached
                                 after — and warmed with one run so the first
                                 real answer is not also the slowest.

  THE RULE THAT OUTRANKS ALL OF IT
  --------------------------------
  Setup may never be the reason somebody cannot sit their interview. Model
  fails, microphone refused, network gives up — every one of those falls
  through to typing and the Session begins anyway. There is a state below for
  each, and none of them is a dead end.

  AND: NOTHING AUTO-STARTS.
  The last thing on this screen is a button the Candidate presses. A clock
  that starts while they are looking at their phone is a clock they lost.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --t-38:2.375rem;--t-30:1.875rem;--t-24:1.5rem;--t-20:1.25rem;--t-18:1.125rem;
  --t-16:1rem;--t-15:.9375rem;--t-14:.875rem;--t-13:.8125rem;--t-12:.75rem;--t-11:.6875rem;
  --lh-tight:1.14;--lh-snug:1.32;--lh-body:1.62;--lh-loose:1.85;--ls-caps:.09em;--ls-tight:-.02em;
  --s-1:2px;--s-2:4px;--s-3:6px;--s-4:8px;--s-5:12px;--s-6:16px;--s-7:20px;--s-8:24px;
  --s-9:32px;--s-10:40px;--s-11:56px;--s-12:72px;--s-13:96px;
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-full:999px;--bw-hair:1px;--bw-thick:2px;
  --d-1:110ms;--d-2:170ms;--d-3:260ms;--e-out:cubic-bezier(.16,1,.3,1);
  --h-topbar:56px;--w-rail:232px;--w-panel:348px;--w-wrap:1320px;

  --bg:oklch(.170 .006 265);--surface:oklch(.205 .007 265);--surface-2:oklch(.252 .009 265);
  --surface-3:oklch(.300 .010 265);
  --fg:oklch(.962 .003 265);--fg-2:oklch(.840 .006 265);--muted:oklch(.672 .012 265);--faint:oklch(.580 .012 265);
  --border:oklch(.270 .009 265);--border-2:oklch(.310 .010 265);
  --accent:oklch(.800 .150 190);--accent-hov:oklch(.865 .140 190);
  --accent-soft:oklch(.800 .150 190/.14);--accent-line:oklch(.800 .150 190/.42);
  --on-accent:oklch(.180 .024 190);
  --risk:oklch(.680 .190 24);--warn:oklch(.812 .148 78);--ok:oklch(.770 .135 158);
  --live:oklch(.700 .200 20);
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:Inter,system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg-2);font-family:var(--font-body);
  font-size:var(--t-14);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--fg);margin:0;
  letter-spacing:var(--ls-tight);line-height:var(--lh-tight)}
.display{font-size:var(--t-38);font-family:var(--font-display);color:var(--fg);
  letter-spacing:var(--ls-tight);line-height:1.08}
.h1{font-size:var(--t-30)}.h2{font-size:var(--t-24)}.h3{font-size:var(--t-20)}.h4{font-size:var(--t-18)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--font-mono);font-size:var(--t-12)}
.eyebrow{font-family:var(--font-mono);font-size:var(--t-11);letter-spacing:var(--ls-caps);
  text-transform:uppercase;color:var(--muted);display:block}
.caption{font-size:var(--t-12);color:var(--muted);line-height:var(--lh-body)}
.body{font-size:var(--t-15);line-height:var(--lh-loose)}
.dim{color:var(--muted)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:var(--s-4)}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--s-5)}
.stack{display:grid}
.g3{gap:var(--s-3)}.g4{gap:var(--s-4)}.g5{gap:var(--s-5)}.g6{gap:var(--s-6)}
.g7{gap:var(--s-7)}.g8{gap:var(--s-8)}.g9{gap:var(--s-9)}
.mt2{margin-top:var(--s-2)}.mt4{margin-top:var(--s-4)}.mt5{margin-top:var(--s-5)}
.mt6{margin-top:var(--s-6)}.mt7{margin-top:var(--s-7)}.mt8{margin-top:var(--s-8)}
.mt9{margin-top:var(--s-9)}.mt10{margin-top:var(--s-10)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- controls --------------------------------------------------------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  gap:var(--s-4);height:36px;padding:0 var(--s-6);border-radius:var(--r-sm);
  border:var(--bw-hair) solid var(--border-2);color:var(--fg-2);font-size:var(--t-13);
  transition:background var(--d-1),border-color var(--d-1),color var(--d-1)}
.btn:hover{background:var(--surface-2);color:var(--fg)}
.btn--primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:500}
.btn--primary:hover{background:var(--accent-hov);color:var(--on-accent)}
.btn--lg{height:48px;padding:0 var(--s-9);font-size:var(--t-15)}
.btn--sm{height:28px;padding:0 var(--s-5);font-size:var(--t-12)}
.btn--ghost{border-color:transparent}
.btn[disabled]{opacity:.38;pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:var(--s-3);height:22px;padding:0 var(--s-4);
  border-radius:var(--r-full);border:var(--bw-hair) solid var(--border-2);
  font-family:var(--font-mono);font-size:var(--t-11);color:var(--muted);white-space:nowrap}
.tag[data-tone=ok]{color:var(--ok);border-color:color-mix(in oklch,var(--ok) 40%,transparent)}
.tag[data-tone=warn]{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 40%,transparent)}
.tag[data-tone=risk]{color:var(--risk);border-color:color-mix(in oklch,var(--risk) 40%,transparent)}
.tag[data-tone=accent]{color:var(--accent);border-color:var(--accent-line)}
.panel{background:var(--surface);border:var(--bw-hair) solid var(--border);border-radius:var(--r-md)}
.meter{height:3px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);
  transition:width var(--d-3) var(--e-out)}
.meter--thick{height:5px}
.meter[data-stalled]>i{background:var(--warn)}

/* =========================================== the setup screen, all three ===
   No nav rail. The same argument onboarding makes: a rail around a screen you
   are meant to sit through is an invitation to leave it half-done — and here
   leaving half-done means a Session that is started, paid for and abandoned. */
.setup{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;
  padding:var(--s-8) var(--s-9)}
.setup-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s-6)}
.brand{display:flex;align-items:center;gap:var(--s-4);color:var(--fg);
  font-family:var(--font-display);font-weight:600;letter-spacing:var(--ls-tight)}
.brand-mark{width:24px;height:24px;border-radius:var(--r-xs);background:var(--accent);
  color:var(--on-accent);display:grid;place-items:center;font-size:var(--t-13)}
.setup-body{display:grid;place-items:center;padding:var(--s-9) 0}
.setup-col{width:100%;max-width:560px}
.setup-col--wide{max-width:820px}
.setup-foot{display:flex;align-items:center;justify-content:space-between;
  gap:var(--s-6);flex-wrap:wrap}

/* The one moving thing. A ring, drawn from the real fraction — not a spinner,
   because a spinner spins just as happily when nothing is happening. */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--surface-3)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;
  transition:stroke-dashoffset var(--d-3) var(--e-out)}
.ring[data-stalled] .fg{stroke:var(--warn)}
.ring[data-done] .fg{stroke:var(--ok)}
.ring-mid{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:var(--t-13);color:var(--fg)}

/* One line at a time, and it crossfades rather than jumping. */
.line{min-height:2.6em}
.line-now{font-size:var(--t-20);font-family:var(--font-display);color:var(--fg);
  line-height:var(--lh-snug);letter-spacing:var(--ls-tight)}

/* The three checks. */
.steps{display:grid;gap:var(--s-1)}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:var(--s-6);
  align-items:center;padding:var(--s-6) var(--s-5);
  border-bottom:var(--bw-hair) solid var(--border)}
.step:last-child{border-bottom:0}
.step-mark{width:22px;height:22px;border-radius:var(--r-full);display:grid;place-items:center;
  border:var(--bw-hair) solid var(--border-2);color:var(--faint);
  font-family:var(--font-mono);font-size:var(--t-11)}
.step[data-state=now] .step-mark{border-color:var(--accent-line);color:var(--accent)}
.step[data-state=done] .step-mark{border-color:transparent;background:var(--ok);
  color:oklch(.18 .03 158)}
.step[data-state=fail] .step-mark{border-color:transparent;background:var(--warn);
  color:oklch(.18 .03 78)}
.step-t{color:var(--faint);font-size:var(--t-15);transition:color var(--d-2)}
.step[data-state=now] .step-t,.step[data-state=done] .step-t{color:var(--fg)}
.step[data-state=fail] .step-t{color:var(--fg)}
.step-sub{display:block;font-size:var(--t-12);color:var(--muted);margin-top:2px}
.step-r{font-family:var(--font-mono);font-size:var(--t-11);color:var(--faint)}

/* The spinner that is allowed, because it is 22px and inside a step. */
.spin{width:12px;height:12px;border-radius:var(--r-full);
  border:1.5px solid var(--accent-line);border-top-color:var(--accent);
  animation:turn .7s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

/* ---- the soundcheck ---------------------------------------------------- */
.mic-wrap{position:relative;display:grid;place-items:center;flex:none}
.mic-wrap::before{content:"";position:absolute;inset:-10px;border-radius:var(--r-full);
  border:var(--bw-hair) solid color-mix(in oklch,var(--live) 45%,transparent);
  opacity:0;transform:scale(.9);transition:opacity var(--d-2),transform var(--d-2)}
.mic-wrap[data-live]::before{opacity:1;transform:scale(calc(1 + var(--level,0) * .10))}
.mic{width:64px;height:64px;border-radius:var(--r-full);display:grid;place-items:center;
  border:var(--bw-hair) solid var(--border-2);background:var(--surface-2);color:var(--fg-2);
  flex:none;transition:background var(--d-2),border-color var(--d-2),color var(--d-2),transform var(--d-1)}
.mic:hover{background:var(--surface-3);color:var(--fg)}
.mic:active{transform:scale(.96)}
.mic[data-state=listening]{background:var(--live);border-color:transparent;color:oklch(.16 .02 20)}
.mic[data-state=listening]:hover{background:var(--live)}
.mic[disabled]{opacity:.4;pointer-events:none}
.levels{display:flex;align-items:center;gap:3px;height:34px}
.levels i{width:3px;border-radius:var(--r-full);background:var(--live);
  height:calc(4px + var(--h,0) * 30px);transition:height 80ms linear;opacity:.85}
.levels[data-idle] i{background:var(--surface-3);height:4px}

/* The line they are asked to read. Chosen to contain the exact words the
   model is worst at, so the soundcheck tests the thing that actually breaks. */
.readback{font-size:var(--t-20);font-family:var(--font-display);color:var(--fg);
  line-height:var(--lh-snug);letter-spacing:var(--ls-tight)}
.readback .key{color:var(--accent)}
.heard{font-size:var(--t-15);line-height:var(--lh-loose);color:var(--fg-2)}
.heard .hit{color:var(--ok)}
.heard .miss{color:var(--warn);text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:4px}

/* ---- what the Session will be ------------------------------------------ */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-1);
  border:var(--bw-hair) solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--border)}
.fact{background:var(--surface);padding:var(--s-7);display:grid;gap:var(--s-3)}
.fact b{font-family:var(--font-display);font-size:var(--t-24);color:var(--fg);font-weight:500}
.mods{display:flex;flex-wrap:wrap;gap:var(--s-4)}

.notice{display:flex;align-items:flex-start;gap:var(--s-5);padding:var(--s-6) var(--s-7);
  border-radius:var(--r-sm);border:var(--bw-hair) solid var(--border-2);background:var(--surface-2)}
.notice[data-tone=risk]{border-color:color-mix(in oklch,var(--risk) 42%,transparent)}
.notice[data-tone=warn]{border-color:color-mix(in oklch,var(--warn) 42%,transparent)}
.notice[data-tone=ok]{border-color:color-mix(in oklch,var(--ok) 42%,transparent)}
.notice-ico{flex:none;width:20px;height:20px;display:grid;place-items:center;
  color:var(--muted);margin-top:1px}
.notice[data-tone=risk] .notice-ico{color:var(--risk)}
.notice[data-tone=warn] .notice-ico{color:var(--warn)}
.notice[data-tone=ok] .notice-ico{color:var(--ok)}

/* The detail nobody has to read, one click from the person who wants it. */
details{border-top:var(--bw-hair) solid var(--border);padding-top:var(--s-5)}
summary{cursor:pointer;list-style:none;font-size:var(--t-12);color:var(--muted);
  display:inline-flex;align-items:center;gap:var(--s-4)}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--fg-2)}
summary::before{content:"";width:5px;height:5px;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform var(--d-1)}
details[open] summary::before{transform:rotate(45deg)}
.tech{margin-top:var(--s-5);display:grid;gap:var(--s-4)}
.tech-row{display:flex;justify-content:space-between;gap:var(--s-6);
  font-family:var(--font-mono);font-size:var(--t-11);color:var(--muted)}
.tech-row b{color:var(--fg-2);font-weight:400}

/* ---- the prototype switcher (not part of the design) ------------------- */
.switch{position:fixed;left:50%;bottom:var(--s-7);transform:translateX(-50%);z-index:999;
  display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3);border-radius:var(--r-full);
  background:oklch(.98 0 0);color:oklch(.18 0 0);
  box-shadow:0 8px 30px rgb(0 0 0/.5);font-family:var(--font-mono);font-size:var(--t-12)}
.switch button{width:30px;height:30px;border-radius:var(--r-full);display:grid;place-items:center;
  color:oklch(.30 0 0)}
.switch button:hover{background:oklch(.90 0 0)}
.switch .lbl{padding:0 var(--s-5);white-space:nowrap;font-weight:500}
.states{position:fixed;right:var(--s-7);bottom:var(--s-7);z-index:999;display:grid;gap:2px;
  padding:var(--s-4);border-radius:var(--r-md);background:oklch(.98 0 0);color:oklch(.18 0 0);
  box-shadow:0 8px 30px rgb(0 0 0/.5);font-family:var(--font-mono);font-size:var(--t-11);
  max-width:250px}
.states b{font-weight:600;padding:0 var(--s-4) var(--s-3);color:oklch(.40 0 0)}
.states button{text-align:left;padding:var(--s-3) var(--s-4);border-radius:var(--r-xs);
  color:oklch(.30 0 0);display:flex;gap:var(--s-4)}
.states button:hover{background:oklch(.92 0 0)}
.states button[aria-pressed=true]{background:oklch(.18 0 0);color:oklch(.98 0 0)}
.states .n{opacity:.5;width:10px}
@media(max-width:1150px){.states{display:none}}
@media(max-width:820px){
  .setup{padding:var(--s-7) var(--s-6)}
  .facts{grid-template-columns:1fr}
  .display{font-size:var(--t-30)}
}
</style>
</head>
<body>
<div id="root"></div>

<div class="switch" role="group" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">&lsaquo;</button>
  <span class="lbl" id="lbl">A</span>
  <button id="next" aria-label="Next variant">&rsaquo;</button>
</div>
<div class="states" id="states" role="group" aria-label="Setup state"></div>

<script>
/* ============================================================== fake data ===
   What `POST /v1/sessions` comes back with, plus the plan it fixed. The
   Session exists from the moment this screen appears — that is the point of
   doing the waiting here. */
const SESSION = {
  id: "ses_a41c07",
  modules: ["Attention", "Transformers", "Tokenisation"],
  questions: 8,
  minutes: 50,
  route: "credits",
  provider: "deepseek",
};

/* The soundcheck sentence. Not filler: every highlighted word is one this
   model is known to mangle, so a Candidate who reads it learns whether their
   microphone and their accent survive the terms this examination is made of. */
const CHECK_LINE = [
  ["I", 0], ["would", 0], ["scale", 0], ["the", 0], ["logits", 1], ["before", 0],
  ["the", 0], ["softmax", 1], ["and", 0], ["train", 0], ["it", 0], ["in", 0],
  ["PyTorch", 1], ["with", 0], ["a", 0], ["ReLU", 1], ["head.", 0],
];
/* What came back. Two right, one near, one wrong — the honest result. */
const CHECK_HEARD = [
  ["I", 1], ["would", 1], ["scale", 1], ["the", 1], ["logits", 1], ["before", 1],
  ["the", 1], ["softmax", 1], ["and", 1], ["train", 1], ["it", 1], ["in", 1],
  ["PyTorch", 1], ["with", 1], ["a", 1], ["rely", 0], ["you", 0], ["head.", 1],
];

/* ================================================================= icons === */
const ICO = {
  mic: (s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>`,
  stop: (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>`,
  go: (s = 17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>`,
  tick: (s = 12) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 6.5"/></svg>`,
  warn: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 17.5A1.9 1.9 0 0 0 4 20.4h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0z"/><path d="M12 9v4M12 16.6v.1"/></svg>`,
  info: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>`,
  ok: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.6 2.6L16 9.5"/></svg>`,
};

function levels(n, t, live) {
  const bars = Array.from({ length: n }, (_, i) => {
    if (!live) return `<i style="--h:0"></i>`;
    const v = Math.abs(Math.sin(t * 0.9 + i * 0.55)) * (0.35 + 0.65 * Math.abs(Math.sin(t * 0.31 + i)));
    return `<i style="--h:${v.toFixed(3)}"></i>`;
  }).join("");
  return `<div class="levels"${live ? "" : " data-idle"} aria-hidden="true">${bars}</div>`;
}

function ring(pct, tone) {
  const r = 44, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct / 100)));
  return `<div class="ring"${tone ? ` data-${tone}` : ""}>
    <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
      <circle class="bg" cx="48" cy="48" r="${r}"></circle>
      <circle class="fg" cx="48" cy="48" r="${r}"
              stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle>
    </svg>
    <span class="ring-mid">${tone === "done" ? ICO.tick(18) : pct + "%"}</span>
  </div>`;
}

/* ============================================================ the states ===
   Two of these are the happy path. The other six are the reason this screen
   exists at all — every one of them still ends with a Session that can be
   sat. */
const STATES = [
  ["setting",   "Setting up (the normal case)"],
  ["ready",     "Ready — waiting on the Candidate"],
  ["cached",    "Second visit — nothing to download"],
  ["slow",      "Slow network — the wait is explained"],
  ["listening", "Soundcheck — speaking"],
  ["heard",     "Soundcheck — what came back"],
  ["denied",    "Microphone refused"],
  ["failed",    "Speech recognition unavailable"],
  ["starting",  "Opening the first question"],
];

/* ============================================================ the chrome === */
function shell(inner, foot) {
  return `
  <div class="setup">
    <header class="setup-top">
      <div class="brand"><span class="brand-mark">I</span> InterviewLM</div>
      <div class="row g5">
        <span class="tag">${SESSION.modules.length} Modules</span>
        <span class="tag">${SESSION.minutes} min</span>
        <button class="btn btn--ghost btn--sm">Cancel</button>
      </div>
    </header>
    <div class="setup-body"><div class="setup-col${inner.wide ? " setup-col--wide" : ""}">${inner.html}</div></div>
    <footer class="setup-foot">
      <span class="caption">${foot || "Your voice is transcribed in this browser and never uploaded."}</span>
      <span class="caption mono dim">${SESSION.id}</span>
    </footer>
  </div>`;
}

/* Shared, because these read identically in all three and disagreeing about
   them would be a design accident rather than a design choice. */
const facts = () => `
  <div class="facts">
    <div class="fact"><span class="eyebrow">Questions</span><b>${SESSION.questions}</b>
      <span class="caption">Fixed. It will not grow.</span></div>
    <div class="fact"><span class="eyebrow">Time</span><b>${SESSION.minutes}m</b>
      <span class="caption">From when you begin.</span></div>
    <div class="fact"><span class="eyebrow">Scope</span><b>${SESSION.modules.length}</b>
      <span class="caption">${SESSION.modules.join(" · ")}</span></div>
  </div>`;

const tech = (pct, stalled) => `
  <details>
    <summary>What is happening</summary>
    <div class="tech">
      <div class="tech-row"><span>plan</span><b>fixed · ${SESSION.questions} questions</b></div>
      <div class="tech-row"><span>microphone</span><b>granted</b></div>
      <div class="tech-row"><span>speech model</span><b>distil-whisper · q8 · ${pct}% of 60MB</b></div>
      <div class="tech-row"><span>runs on</span><b>WebGPU</b></div>
      <div class="tech-row"><span>uploaded</span><b>nothing</b></div>
      ${stalled ? `<div class="tech-row"><span>throughput</span><b style="color:var(--warn)">~180 KB/s</b></div>` : ""}
    </div>
  </details>`;

const beginBtn = (label = "Begin the interview") =>
  `<button class="btn btn--primary btn--lg" data-go>${label} ${ICO.go()}</button>`;

/* The two ways setup can fail, and they read the same in all three variants:
   a plain statement, then the Session begins anyway. Neither is a dead end,
   because a Candidate who cannot sit their interview because of our download
   has been failed by us, not by their equipment. */
const failBox = (kind) => kind === "denied" ? `
  <div class="notice" data-tone="risk">
    <span class="notice-ico">${ICO.warn()}</span>
    <span class="grow stack g4">
      <strong style="color:var(--fg)">This browser will not give us the microphone.</strong>
      <span class="caption">
        Allow it in the address bar and we will pick it up — or begin anyway and type
        your answers. The interview is the same either way, and you can switch to
        speaking the moment it is allowed.
      </span>
    </span>
  </div>` : `
  <div class="notice" data-tone="warn">
    <span class="notice-ico">${ICO.warn()}</span>
    <span class="grow stack g4">
      <strong style="color:var(--fg)">Speech recognition could not be set up here.</strong>
      <span class="caption">
        This browser could not load it, so answers will be typed. Nothing else about the
        interview changes — the same ${SESSION.questions} questions, the same ${SESSION.minutes} minutes,
        graded the same way.
      </span>
    </span>
  </div>`;

/* =========================================================== variant A ====
   ONE LINE AT A TIME.
   A ring, a sentence, and nothing else. The sentence names what is happening
   now in the Candidate's terms; the detail is behind a disclosure for the one
   person in fifty who wants it. */
function variantA(s, t) {
  const foot = "Nothing you say is uploaded. The transcription happens on this machine.";

  if (s === "denied" || s === "failed") return shell({ html: `
    <span class="eyebrow">Almost ready</span>
    <h1 class="display mt5">You will be typing.</h1>
    <div class="mt8">${failBox(s)}</div>
    <div class="mt8">${facts()}</div>
    <div class="row g5 mt9" style="flex-wrap:wrap">
      ${beginBtn()}
      <button class="btn">${s === "denied" ? "Try the microphone again" : "Try again"}</button>
    </div>` }, foot);

  if (s === "ready" || s === "cached") return shell({ html: `
    <span class="eyebrow">Ready</span>
    <h1 class="display mt5">Everything is set. Begin when you are.</h1>
    <p class="body dim mt6" style="max-width:52ch">
      The clock starts on the first question, not now. Answer out loud — you will read
      back what we heard before any of it is sent.
    </p>
    <div class="mt9">${facts()}</div>
    <div class="row g5 mt9" style="flex-wrap:wrap">
      ${beginBtn()}
      <button class="btn">Test my microphone first</button>
    </div>
    <div class="mt9">${tech(100)}</div>` }, s === "cached"
      ? "Ready straight away — speech recognition was already on this machine from last time."
      : foot);

  if (s === "starting") return shell({ html: `
    <div class="row g8">
      ${ring(100, "done")}
      <span class="stack g5">
        <span class="eyebrow">Beginning</span>
        <span class="line-now">Opening the first question…</span>
        <span class="caption">The clock has started.</span>
      </span>
    </div>` }, foot);

  const slow = s === "slow";
  const pct = slow ? 34 : Math.min(97, 12 + Math.floor(t * 9) % 88);
  const lines = [
    "Fixing the plan for this interview…",
    "Getting ready to hear you…",
    "Warming up so the first answer is not the slow one…",
  ];
  const now = slow ? "Still getting ready to hear you." : lines[Math.floor(t / 2.2) % lines.length];

  return shell({ html: `
    <div class="row g8" style="align-items:flex-start">
      ${ring(pct, slow ? "stalled" : null)}
      <span class="stack g5 grow" style="padding-top:var(--s-4)">
        <span class="eyebrow">Setting up your interview</span>
        <span class="line"><span class="line-now">${now}</span></span>
        ${slow ? `<span class="caption">
          Your connection is slow today, so the part that listens is taking longer than
          usual to arrive. It is a one-time download and it is kept afterwards. You can
          begin now and type instead — the interview is the same.
        </span>` : `<span class="caption">
          A few seconds, and only the first time. Nothing is timed yet.
        </span>`}
      </span>
    </div>
    ${slow ? `<div class="row g5 mt9" style="flex-wrap:wrap">
      ${beginBtn("Begin now and type")}
      <button class="btn">Keep waiting</button>
    </div>` : ""}
    <div class="mt9">${facts()}</div>
    <div class="mt8">${tech(pct, slow)}</div>` }, foot);
}

/* =========================================================== variant B ====
   THREE CHECKS, TICKING OFF.
   The same three things, named and ticked. Costs more room and pays for it
   the moment something stalls: the screen already says which of the three it
   was, without anybody opening anything. */
function variantB(s, t) {
  const foot = "Nothing you say is uploaded. The transcription happens on this machine.";
  const slow = s === "slow";
  const done = s === "ready" || s === "cached" || s === "starting";

  const at = done ? 3 : slow ? 2 : Math.min(2, Math.floor(t / 2.4) % 3);
  const pct = slow ? 34 : done ? 100 : Math.min(97, 12 + Math.floor(t * 9) % 88);

  const stepState = (i) => {
    if (s === "denied" && i === 1) return "fail";
    if (s === "failed" && i === 2) return "fail";
    if (done) return "done";
    return i < at ? "done" : i === at ? "now" : "wait";
  };
  const mark = (st, n) => st === "done" ? ICO.tick() : st === "fail" ? "!" : n;
  const right = (i, st) => {
    if (st === "done") return `<span class="step-r">done</span>`;
    if (st === "fail") return `<span class="step-r" style="color:var(--warn)">skipped</span>`;
    if (st !== "now") return "";
    if (i === 2) return `<span class="step-r">${pct}%</span>`;
    return `<span class="spin" aria-hidden="true"></span>`;
  };

  const STEPS = [
    ["Fixing the plan", "What you will be asked is decided once, now, and never changes."],
    ["Checking your microphone", "Asked for here so a permission box never lands on a running clock."],
    ["Getting ready to hear you", slow
      ? "A slow connection today. One-time download, kept afterwards."
      : "A one-time setup on this machine. Instant every time after this."],
  ];

  const failNote = s === "denied" || s === "failed" ? `<div class="mt7">${failBox(s)}</div>` : "";

  if (s === "starting") return shell({ html: `
    <span class="eyebrow">Beginning</span>
    <h1 class="display mt5">Opening the first question…</h1>
    <p class="caption mt6">The clock has started.</p>` }, foot);

  return shell({ html: `
    <span class="eyebrow">${done ? "Ready" : "Setting up your interview"}</span>
    <h1 class="display mt5">${
      done ? "Everything is set. Begin when you are."
      : s === "denied" || s === "failed" ? "You will be typing."
      : slow ? "Nearly there — your connection is slow today."
      : "This takes a few seconds."
    }</h1>
    ${done ? `<p class="body dim mt6" style="max-width:52ch">
      The clock starts on the first question, not now. Answer out loud — you will read back
      what we heard before any of it is sent.
    </p>` : ""}

    <div class="panel mt9">
      <div class="steps">
        ${STEPS.map(([title, sub], i) => {
          const st = stepState(i);
          return `<div class="step" data-state="${st}">
            <span class="step-mark">${mark(st, i + 1)}</span>
            <span><span class="step-t">${title}</span><span class="step-sub">${sub}</span></span>
            ${right(i, st)}
          </div>`;
        }).join("")}
      </div>
      ${!done && !failNote ? `<div class="meter" style="border-radius:0 0 var(--r-md) var(--r-md)"
        ${slow ? "data-stalled" : ""}><i style="width:${pct}%"></i></div>` : ""}
    </div>
    ${failNote}
    <div class="mt8">${facts()}</div>
    <div class="row g5 mt9" style="flex-wrap:wrap">
      ${done || failNote ? beginBtn() : slow ? beginBtn("Begin now and type") : `<button class="btn btn--primary btn--lg" disabled>Begin the interview ${ICO.go()}</button>`}
      ${done ? `<button class="btn">Test my microphone first</button>` : ""}
      ${s === "denied" ? `<button class="btn">Try the microphone again</button>` : ""}
      ${slow ? `<button class="btn">Keep waiting</button>` : ""}
    </div>` }, foot);
}

/* =========================================================== variant C ====
   THE SOUNDCHECK.
   The wait is spent proving the thing that actually breaks. The Candidate
   reads one sentence containing the exact vocabulary this model mangles, and
   sees what came back. It costs twenty seconds before the clock and it is the
   only variant where somebody finds out that "ReLU" comes back "rely you"
   BEFORE it costs them a Topic. */
function variantC(s, t) {
  const foot = "This is a rehearsal. Nothing here is recorded, graded, or uploaded.";

  if (s === "denied" || s === "failed") return shell({ html: `
    <span class="eyebrow">Almost ready</span>
    <h1 class="display mt5">You will be typing.</h1>
    <div class="mt8">${failBox(s)}</div>
    <div class="mt8">${facts()}</div>
    <div class="row g5 mt9" style="flex-wrap:wrap">${beginBtn()}
      <button class="btn">${s === "denied" ? "Try the microphone again" : "Try again"}</button></div>` }, foot);

  if (s === "starting") return shell({ html: `
    <span class="eyebrow">Beginning</span>
    <h1 class="display mt5">Opening the first question…</h1>
    <p class="caption mt6">The clock has started.</p>` }, foot);

  const line = `<p class="readback">${CHECK_LINE.map(([w, k]) =>
    k ? `<span class="key">${w}</span>` : w).join(" ")}</p>`;

  if (s === "heard") return shell({ wide: true, html: `
    <span class="eyebrow">Soundcheck</span>
    <h1 class="display mt5">We heard you.</h1>
    <div class="panel mt8" style="padding:var(--s-8);display:grid;gap:var(--s-7)">
      <div class="stack g4">
        <span class="eyebrow">You read</span>
        ${line}
      </div>
      <div class="stack g4" style="border-top:var(--bw-hair) solid var(--border);padding-top:var(--s-7)">
        <span class="eyebrow">It came back as</span>
        <p class="heard">${CHECK_HEARD.map(([w, ok]) =>
          `<span class="${ok ? "hit" : "miss"}">${w}</span>`).join(" ")}</p>
      </div>
    </div>
    <div class="notice mt7" data-tone="warn">
      <span class="notice-ico">${ICO.info()}</span>
      <span class="grow stack g4">
        <strong style="color:var(--fg)">One term came back wrong: <span class="mono">ReLU</span> → <span class="mono">rely you</span>.</strong>
        <span class="caption">
          This is why you read every answer back before it is sent. What is graded is the
          text, so a term it mishears is a term you did not say — and on this screen it
          costs you nothing to find that out.
        </span>
      </span>
    </div>
    <div class="row g5 mt9" style="flex-wrap:wrap">
      ${beginBtn()}
      <button class="btn" data-mic>Read it again</button>
    </div>` }, foot);

  const listening = s === "listening";
  const busy = s === "setting" || s === "slow";
  const pct = s === "slow" ? 34 : Math.min(97, 12 + Math.floor(t * 9) % 88);

  return shell({ wide: true, html: `
    <span class="eyebrow">${busy ? "Setting up your interview" : "Soundcheck"}</span>
    <h1 class="display mt5">${
      busy ? "One moment — getting ready to hear you." : "Read this out loud."
    }</h1>
    <p class="body dim mt6" style="max-width:56ch">
      ${busy
        ? "Then you will read one line out loud, so you can see what we hear before any of it counts."
        : "It has the words this gets wrong most often. Twenty seconds now, and you will know exactly what to watch for."}
    </p>

    <div class="panel mt8" style="padding:var(--s-9)">
      <div class="stack g8">
        ${line}
        <div class="row g7" style="border-top:var(--bw-hair) solid var(--border);padding-top:var(--s-8)">
          <div class="mic-wrap"${listening ? ` data-live style="--level:${Math.abs(Math.sin(t)).toFixed(2)}"` : ""}>
            <button class="mic" data-mic data-state="${listening ? "listening" : "idle"}"
                    ${busy ? "disabled" : ""}
                    aria-label="${listening ? "Stop the soundcheck" : "Start the soundcheck"}">
              ${listening ? ICO.stop(24) : ICO.mic(26)}
            </button>
          </div>
          <span class="grow stack g4">
            ${busy
              ? `<span class="row g6"><span class="grow"><span class="meter meter--thick"
                   ${s === "slow" ? "data-stalled" : ""}><i style="width:${pct}%"></i></span></span>
                 <span class="mono dim">${pct}%</span></span>
                 <span class="caption">${s === "slow"
                   ? "A slow connection today. One-time download, kept afterwards — or skip it and type."
                   : "A one-time setup on this machine. Instant every time after this."}</span>`
              : listening
                ? `<span class="row g6">${levels(24, t, true)}</span>
                   <span class="caption">Listening. Press again when you have read it.</span>`
                : `<span class="h4">Press, and read the line.</span>
                   <span class="caption">Nothing here is recorded or graded.</span>`}
          </span>
        </div>
      </div>
    </div>

    <div class="row g5 mt9" style="flex-wrap:wrap">
      ${busy ? beginBtn(s === "slow" ? "Skip it and type" : "Skip the soundcheck")
             : beginBtn("Skip it — begin the interview")}
      ${!busy ? `<span class="caption">You can skip this. Most people do it once.</span>` : ""}
    </div>
    <div class="mt8">${tech(pct, s === "slow")}</div>` }, foot);
}

/* --------------------------------------------------------------- render -- */
const VARIANTS = {
  A: { name: "One line at a time", fn: variantA },
  B: { name: "Three checks, ticking off", fn: variantB },
  C: { name: "The soundcheck", fn: variantC },
};
const KEYS = Object.keys(VARIANTS);
let variant = "A";
let state = "setting";
let t = 0;

document.getElementById("states").innerHTML =
  `<b>State</b>` + STATES.map(([k, label], i) =>
    `<button data-state="${k}"><span class="n">${(i + 1) % 10}</span>${label}</button>`
  ).join("");

function render() {
  document.getElementById("root").innerHTML = VARIANTS[variant].fn(state, t);
  document.getElementById("lbl").textContent = `${variant} — ${VARIANTS[variant].name}`;
  document.querySelectorAll("#states button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.state === state)));
}
function setVariant(k) {
  variant = k;
  const u = new URL(location.href);
  u.searchParams.set("variant", k);
  history.replaceState({}, "", u);
  render();
}
function setState(k) { state = k; render(); }

const cycle = (step) => setVariant(KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length]);
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("states").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-state]");
  if (b) setState(b.dataset.state);
});

/* Live enough to walk it by hand. */
document.getElementById("root").addEventListener("click", (e) => {
  if (e.target.closest("[data-go]")) return setState("starting");
  if (!e.target.closest("[data-mic]")) return;
  setState(state === "listening" ? "heard" : "listening");
});

addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && (/^(INPUT|TEXTAREA)$/.test(el.tagName) || el.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  const n = Number(e.key);
  if (Number.isInteger(n)) {
    const idx = n === 0 ? 9 : n - 1;
    if (STATES[idx]) setState(STATES[idx][0]);
  }
});

/* Only the states that are genuinely in motion animate, so a screenshot of
   the rest is stable. */
setInterval(() => {
  if (!["setting", "listening"].includes(state)) return;
  t += 0.12;
  render();
}, 90);

const url = new URL(location.href);
const asked = url.searchParams.get("variant");
variant = KEYS.includes(asked) ? asked : "A";
const askedState = url.searchParams.get("state");
if (STATES.some(([k]) => k === askedState)) state = askedState;
render();
</script>
</body>
</html>
