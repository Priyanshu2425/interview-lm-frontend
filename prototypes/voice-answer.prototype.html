<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — answering out loud</title>
<!--
  THROWAWAY. Three variants of what the Composer becomes when the Candidate
  speaks their answer instead of typing it. ?variant=A|B|C, the bottom bar, or
  the arrow keys. The state strip on the right of the switcher steps through
  every state the machine can be in — press 1-9, or click.

  THE QUESTION
  ------------
  An Answer Turn is currently a textarea and a submit. Typing an answer to a
  spoken-style question is the wrong shape: an interview is talked, and a
  Candidate who types is editing themselves in a way the examiner then grades.
  So the answer is spoken, transcribed in the browser by Distil-Whisper under
  Transformers.js, and submitted as text — the API is unchanged, because the
  turn was always text.

  WHAT IS ACTUALLY BEING DECIDED HERE
  -----------------------------------
  Not "does a mic button look good". The decision is **who owns the words
  between the mouth and the grader**, and the three variants are three
  different answers:

    A  Speak, then read it back.  Transcription lands in an editable box. The
       Candidate confirms before it is sent. Nothing is graded that they did
       not agree to.

    B  Live dictation.  Partial text streams in while they speak (inference
       every ~2s over a rolling window). Same editable box at the end, but the
       Candidate watches the transcript form and self-corrects as they go.

    C  Speak and send.  Stop talking, it transcribes and submits, with a short
       window to pull it back. Closest to a real interview. No confirmation
       step, which is exactly the risk.

  THE RISK THAT DECIDES IT
  ------------------------
  Distil-Whisper small, 8-bit, gets technical vocabulary wrong in a way that
  is invisible to the person who said it. "PyTorch" comes back "pie torch",
  "logits" comes back "logics", "ReLU" comes back "rely you". This Session is
  GRADED on that text, Topic by Topic, at the end (ISSUE-0045) — and Coverage
  in particular is a reading of whether a Topic was addressed at all. A
  mistranscribed term is a Topic the Candidate covered and the record says
  they did not, and they never find out. That is a false negative in the one
  measurement this product exists to make.

  Which is the whole argument for A over C, and the reason every variant here
  keeps `spoken=true` on the turn — so a low reading on a spoken answer can be
  told apart from a low reading on a typed one when the grading is audited.

  WHAT IS NOT DECIDED HERE (and needs a human)
  --------------------------------------------
  * Is the audio kept? Right now nothing leaves the browser, so there is no
    recording to appeal a bad transcription against. That is a privacy win and
    an evidence loss, and it is a product call, not a UI one.
  * A 60MB model download on first visit. Every variant blocks the composer
    until it is ready, and every variant offers typing as the way through —
    a Candidate mid-Session on hotel wifi cannot be made to wait.
  * Typing never goes away. It is the fallback for a denied microphone, a
    failed model load, a noisy room, and for anybody who cannot or will not
    speak. "Substitute" means the default, not the only way.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --t-38:2.375rem;--t-30:1.875rem;--t-24:1.5rem;--t-20:1.25rem;--t-18:1.125rem;
  --t-16:1rem;--t-14:.875rem;--t-13:.8125rem;--t-12:.75rem;--t-11:.6875rem;
  --lh-tight:1.14;--lh-snug:1.32;--lh-body:1.62;--lh-loose:1.85;--ls-caps:.09em;--ls-tight:-.02em;
  --s-1:2px;--s-2:4px;--s-3:6px;--s-4:8px;--s-5:12px;--s-6:16px;--s-7:20px;--s-8:24px;
  --s-9:32px;--s-10:40px;--s-11:56px;--s-12:72px;--s-13:96px;
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-full:999px;--bw-hair:1px;--bw-thick:2px;
  --d-1:110ms;--d-2:170ms;--d-3:260ms;--e-out:cubic-bezier(.16,1,.3,1);
  --h-topbar:56px;--w-rail:232px;--w-panel:348px;--w-wrap:1320px;

  --bg:oklch(.170 .006 265);--surface:oklch(.205 .007 265);--surface-2:oklch(.252 .009 265);
  --surface-3:oklch(.300 .010 265);
  --fg:oklch(.962 .003 265);--fg-2:oklch(.840 .006 265);--muted:oklch(.672 .012 265);--faint:oklch(.580 .012 265);
  --border:oklch(.270 .009 265);--border-2:oklch(.310 .010 265);
  --accent:oklch(.800 .150 190);--accent-hov:oklch(.865 .140 190);
  --accent-soft:oklch(.800 .150 190/.14);--accent-line:oklch(.800 .150 190/.42);
  --on-accent:oklch(.180 .024 190);
  --risk:oklch(.680 .190 24);--warn:oklch(.812 .148 78);--ok:oklch(.770 .135 158);
  --live:oklch(.700 .200 20);
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:Inter,system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg-2);font-family:var(--font-body);
  font-size:var(--t-14);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--fg);margin:0;letter-spacing:var(--ls-tight);line-height:var(--lh-tight)}
.h1{font-size:var(--t-30)}.h2{font-size:var(--t-24)}.h3{font-size:var(--t-20)}.h4{font-size:var(--t-18)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--font-mono);font-size:var(--t-12)}
.eyebrow{font-family:var(--font-mono);font-size:var(--t-11);letter-spacing:var(--ls-caps);
  text-transform:uppercase;color:var(--muted);display:block}
.caption{font-size:var(--t-12);color:var(--muted);line-height:var(--lh-body)}
.dim{color:var(--muted)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:var(--s-4)}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--s-5)}
.stack{display:grid}
.g4{gap:var(--s-4)}.g5{gap:var(--s-5)}.g6{gap:var(--s-6)}.g7{gap:var(--s-7)}.g8{gap:var(--s-8)}
.mt2{margin-top:var(--s-2)}.mt4{margin-top:var(--s-4)}.mt5{margin-top:var(--s-5)}
.mt6{margin-top:var(--s-6)}.mt8{margin-top:var(--s-8)}.mt9{margin-top:var(--s-9)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- shell ------------------------------------------------------------ */
.app{display:grid;grid-template-columns:var(--w-rail) 1fr;height:100vh;overflow:hidden}
.rail{overflow:auto;border-right:var(--bw-hair) solid var(--border);background:var(--surface);
  padding:var(--s-6) var(--s-5);display:flex;flex-direction:column;gap:var(--s-8)}
.brand{display:flex;align-items:center;gap:var(--s-4);color:var(--fg);font-family:var(--font-display);
  font-weight:600;letter-spacing:var(--ls-tight)}
.brand-mark{width:24px;height:24px;border-radius:var(--r-xs);background:var(--accent);
  color:var(--on-accent);display:grid;place-items:center;font-size:var(--t-13)}
.nav{display:grid;gap:var(--s-1)}
.nav a{display:flex;align-items:center;gap:var(--s-5);padding:var(--s-4) var(--s-5);
  border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-size:var(--t-13)}
.nav a:hover{background:var(--surface-2);color:var(--fg-2)}
.nav a[aria-current]{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current] .dot{background:var(--accent)}
.dot{width:5px;height:5px;border-radius:var(--r-full);background:var(--faint)}
.topbar{height:var(--h-topbar);border-bottom:var(--bw-hair) solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s-6);
  padding:0 var(--s-9);position:sticky;top:0;background:color-mix(in oklch,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);z-index:20}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:auto}
.pad{padding:var(--s-9) var(--s-9) var(--s-13)}
.stage{max-width:760px;width:100%}

/* ---- controls --------------------------------------------------------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  gap:var(--s-4);height:36px;padding:0 var(--s-6);
  border-radius:var(--r-sm);border:var(--bw-hair) solid var(--border-2);color:var(--fg-2);
  font-size:var(--t-13);transition:background var(--d-1),border-color var(--d-1),color var(--d-1)}
.btn:hover{background:var(--surface-2);color:var(--fg)}
.btn--primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:500}
.btn--primary:hover{background:var(--accent-hov);color:var(--on-accent)}
.btn--sm{height:28px;padding:0 var(--s-5);font-size:var(--t-12)}
.btn--ghost{border-color:transparent}
.btn[disabled]{opacity:.42;pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:var(--s-3);height:22px;padding:0 var(--s-4);
  border-radius:var(--r-full);border:var(--bw-hair) solid var(--border-2);
  font-family:var(--font-mono);font-size:var(--t-11);color:var(--muted);white-space:nowrap}
.tag[data-tone=ok]{color:var(--ok);border-color:color-mix(in oklch,var(--ok) 40%,transparent)}
.tag[data-tone=warn]{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 40%,transparent)}
.tag[data-tone=risk]{color:var(--risk);border-color:color-mix(in oklch,var(--risk) 40%,transparent)}
.tag[data-tone=accent]{color:var(--accent);border-color:var(--accent-line)}
.panel{background:var(--surface);border:var(--bw-hair) solid var(--border);border-radius:var(--r-md)}
.meter{height:3px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);transition:width var(--d-3) var(--e-out)}

/* ---- the exchange ------------------------------------------------------ */
.turn{display:grid;gap:var(--s-4);padding:var(--s-7) 0;border-bottom:var(--bw-hair) solid var(--border)}
.turn:last-of-type{border-bottom:0}
.turn-who{font-family:var(--font-mono);font-size:var(--t-11);letter-spacing:var(--ls-caps);
  text-transform:uppercase;color:var(--faint)}
.turn[data-who=examiner] .turn-who{color:var(--accent)}
.turn-body{font-size:var(--t-15,.9375rem);line-height:var(--lh-loose);color:var(--fg-2);max-width:66ch}
.turn[data-who=examiner] .turn-body{color:var(--fg);font-size:var(--t-16)}
.plan-dots{display:flex;gap:var(--s-2)}
.plan-dots i{width:16px;height:3px;border-radius:var(--r-full);background:var(--surface-3)}
.plan-dots i[data-done]{background:var(--muted)}
.plan-dots i[data-now]{background:var(--accent)}

/* ================================================== the voice composer === */
.composer{margin-top:var(--s-9);display:grid;gap:var(--s-5)}
.vbox{background:var(--surface);border:var(--bw-hair) solid var(--border);border-radius:var(--r-md);
  overflow:hidden;transition:border-color var(--d-2)}
.vbox[data-live]{border-color:color-mix(in oklch,var(--live) 55%,transparent)}
.vbox[data-busy]{border-color:var(--accent-line)}
.vbox-main{padding:var(--s-7)}
.vbox-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-5);
  padding:var(--s-5) var(--s-7);border-top:var(--bw-hair) solid var(--border);background:var(--surface)}

/* The one control. A circle, because it is a state and not a menu. */
.mic{width:64px;height:64px;border-radius:var(--r-full);display:grid;place-items:center;
  border:var(--bw-hair) solid var(--border-2);background:var(--surface-2);color:var(--fg-2);
  flex:none;transition:background var(--d-2),border-color var(--d-2),color var(--d-2),transform var(--d-1)}
.mic:hover{background:var(--surface-3);color:var(--fg)}
.mic:active{transform:scale(.96)}
.mic--lg{width:84px;height:84px}
.mic--sm{width:44px;height:44px}
.mic[data-state=listening]{background:var(--live);border-color:transparent;color:oklch(.16 .02 20)}
.mic[data-state=listening]:hover{background:var(--live)}
.mic[data-state=ready]{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.mic[disabled]{opacity:.4;pointer-events:none}
.mic svg{display:block}

/* The halo is the only thing that moves while listening, and it is driven by
   the level meter rather than by a timer — a ring that pulses on its own says
   "recording" even when the mic is muted at the OS. */
.mic-wrap{position:relative;flex:none;display:grid;place-items:center}
.mic-wrap::before{content:"";position:absolute;inset:-10px;border-radius:var(--r-full);
  border:var(--bw-hair) solid color-mix(in oklch,var(--live) 45%,transparent);
  opacity:0;transform:scale(.9);transition:opacity var(--d-2),transform var(--d-2)}
.mic-wrap[data-live]::before{opacity:1;transform:scale(calc(1 + var(--level,0) * .10))}

/* Level bars. Real amplitude, so silence looks like silence. */
.levels{display:flex;align-items:center;gap:3px;height:34px}
.levels i{width:3px;border-radius:var(--r-full);background:var(--live);
  height:calc(4px + var(--h,0) * 30px);transition:height 80ms linear;opacity:.85}
.levels[data-idle] i{background:var(--surface-3);height:4px}

.timer{font-family:var(--font-mono);font-size:var(--t-20);color:var(--fg);letter-spacing:var(--ls-tight)}
.timer[data-warn]{color:var(--warn)}

/* The transcript, once there is one. Editable, and it looks editable. */
.said{width:100%;min-height:104px;resize:vertical;background:transparent;border:0;
  color:var(--fg);font:inherit;font-size:var(--t-15,.9375rem);line-height:var(--lh-loose);
  padding:0;outline:none}
.said::placeholder{color:var(--faint)}
.said:disabled{color:var(--fg-2)}

/* Streaming text: what is settled reads normally, what the model may still
   revise is dimmed, so nobody argues with a word that has not finished. */
.stream{font-size:var(--t-15,.9375rem);line-height:var(--lh-loose);color:var(--fg);min-height:104px}
.stream .prov{color:var(--faint)}
.stream .cursor{display:inline-block;width:7px;height:1em;vertical-align:-2px;
  background:var(--accent);animation:blink 1.05s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}

/* A word the model was not sure about. Underlined rather than highlighted:
   this is a hint to look, not a claim that it is wrong. */
.low{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--warn);
  text-underline-offset:4px;cursor:pointer;border-radius:2px}
.low:hover{background:color-mix(in oklch,var(--warn) 16%,transparent)}

/* Model download / warm-up. */
.load{display:grid;gap:var(--s-5);padding:var(--s-7)}
.notice{display:flex;align-items:flex-start;gap:var(--s-5);padding:var(--s-6) var(--s-7);
  border-radius:var(--r-sm);border:var(--bw-hair) solid var(--border-2);background:var(--surface-2)}
.notice[data-tone=risk]{border-color:color-mix(in oklch,var(--risk) 42%,transparent)}
.notice[data-tone=warn]{border-color:color-mix(in oklch,var(--warn) 42%,transparent)}
.notice-ico{flex:none;width:20px;height:20px;display:grid;place-items:center;color:var(--muted);margin-top:1px}
.notice[data-tone=risk] .notice-ico{color:var(--risk)}
.notice[data-tone=warn] .notice-ico{color:var(--warn)}

/* Send-and-undo. The bar is the undo window, and it drains. */
.undo{display:flex;align-items:center;gap:var(--s-6);padding:var(--s-6) var(--s-7);
  border-radius:var(--r-md);border:var(--bw-hair) solid var(--accent-line);
  background:color-mix(in oklch,var(--accent) 8%,var(--surface))}
.undo-bar{height:2px;background:var(--accent);border-radius:var(--r-full);
  animation:drain 4s linear forwards}
@keyframes drain{from{width:100%}to{width:0%}}

/* The mode switch. Speaking is the default; typing is always one click away. */
.modes{display:inline-flex;padding:2px;border-radius:var(--r-full);background:var(--surface-2);
  border:var(--bw-hair) solid var(--border)}
.modes button{height:26px;padding:0 var(--s-5);border-radius:var(--r-full);
  font-size:var(--t-12);color:var(--muted)}
.modes button[aria-pressed=true]{background:var(--surface-3);color:var(--fg)}

.hint-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-5);flex-wrap:wrap}
.kbd{font-family:var(--font-mono);font-size:var(--t-11);color:var(--faint)}

/* ---- the prototype switcher (not part of the design) ------------------- */
.switch{position:fixed;left:50%;bottom:var(--s-7);transform:translateX(-50%);z-index:999;
  display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3);border-radius:var(--r-full);
  background:oklch(.98 0 0);color:oklch(.18 0 0);
  box-shadow:0 8px 30px rgb(0 0 0/.5);font-family:var(--font-mono);font-size:var(--t-12)}
.switch button{width:30px;height:30px;border-radius:var(--r-full);display:grid;place-items:center;
  color:oklch(.30 0 0)}
.switch button:hover{background:oklch(.90 0 0)}
.switch .lbl{padding:0 var(--s-5);white-space:nowrap;font-weight:500}
.states{position:fixed;right:var(--s-7);bottom:var(--s-7);z-index:999;display:grid;gap:2px;
  padding:var(--s-4);border-radius:var(--r-md);background:oklch(.98 0 0);color:oklch(.18 0 0);
  box-shadow:0 8px 30px rgb(0 0 0/.5);font-family:var(--font-mono);font-size:var(--t-11);
  max-width:240px}
.states b{font-weight:600;padding:0 var(--s-4) var(--s-3);color:oklch(.40 0 0)}
.states button{text-align:left;padding:var(--s-3) var(--s-4);border-radius:var(--r-xs);
  color:oklch(.30 0 0);display:flex;gap:var(--s-4)}
.states button:hover{background:oklch(.92 0 0)}
.states button[aria-pressed=true]{background:oklch(.18 0 0);color:oklch(.98 0 0)}
.states .n{opacity:.5;width:10px}
@media(max-width:1100px){.states{display:none}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}.rail{display:none}
  .pad{padding:var(--s-7) var(--s-6) var(--s-13)}
}
</style>
</head>
<body>
<div id="root"></div>

<div class="switch" role="group" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">&lsaquo;</button>
  <span class="lbl" id="lbl">A</span>
  <button id="next" aria-label="Next variant">&rsaquo;</button>
</div>
<div class="states" id="states" role="group" aria-label="Composer state"></div>

<script>
/* ============================================================== fake data ===
   One open question from a Session mid-plan. The turn shape is what
   `useExamination` already hands the Transcript; nothing here needs the API
   to change, because an Answer Turn was always text. */
const TURNS = [
  { who: "examiner", body: "Attention is described as letting a token look at every other token. Walk me through what is actually computed for one query vector — the tensors involved, and what the softmax is over." },
  { who: "candidate", body: "So you take the input embeddings and project them three times, into queries, keys and values. For one query you dot it against every key, which gives you a score per position, then you divide by the square root of the key dimension before the softmax." },
  { who: "examiner", body: "Good. You divided by the square root of d_k. What breaks if you do not?" },
];

/* What a transcription comes back as. `conf` is the per-word score
   Transformers.js can return; anything under the threshold is offered for a
   second look rather than silently trusted. */
const SAID_WORDS = [
  ["The", .99], ["dot", .98], ["products", .97], ["grow", .96], ["with", .99],
  ["the", .99], ["dimension,", .93], ["so", .98], ["for", .99], ["large", .97],
  ["d", .71], ["k", .68], ["the", .99], ["scores", .97], ["land", .95],
  ["far", .96], ["out", .97], ["in", .99], ["the", .99], ["tails", .94],
  ["and", .99], ["the", .99], ["softmax", .88], ["saturates.", .91],
  ["The", .99], ["gradient", .96], ["through", .97], ["it", .98], ["goes", .97],
  ["to", .99], ["essentially", .94], ["zero,", .95], ["so", .98], ["nothing", .97],
  ["upstream", .93], ["learns.", .96], ["Scaling", .92], ["by", .99],
  ["root", .74], ["d", .70], ["k", .66], ["keeps", .97], ["the", .99],
  ["variance", .94], ["of", .99], ["the", .99], ["scores", .96], ["at", .99],
  ["roughly", .95], ["one.", .97],
];
const SAID = SAID_WORDS.map(([w]) => w).join(" ");
const LOW = 0.78;

const saidHtml = (words = SAID_WORDS) => words.map(([w, c]) =>
  c < LOW ? `<span class="low" title="Heard with low confidence — check this one">${w}</span>` : w
).join(" ");

/* ================================================================= icons === */
const ICO = {
  mic: (s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>`,
  stop: (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>`,
  send: (s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>`,
  redo: (s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`,
  info: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>`,
  warn: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 17.5A1.9 1.9 0 0 0 4 20.4h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0z"/><path d="M12 9v4M12 16.6v.1"/></svg>`,
};

/* ---- level meter, faked from a waveform so silence reads as silence ---- */
function levels(n, t, live) {
  const bars = Array.from({ length: n }, (_, i) => {
    if (!live) return `<i style="--h:0"></i>`;
    const v = Math.abs(Math.sin(t * 0.9 + i * 0.55)) * (0.35 + 0.65 * Math.abs(Math.sin(t * 0.31 + i)));
    return `<i style="--h:${v.toFixed(3)}"></i>`;
  }).join("");
  return `<div class="levels"${live ? "" : " data-idle"} aria-hidden="true">${bars}</div>`;
}

/* ============================================================ the states ===
   Every one of these is a real state the machine can be in, and each variant
   has to answer all of them. Naming them is most of the design work. */
const STATES = [
  ["loading",   "Model downloading (60MB, first visit)"],
  ["idle",      "Ready — nothing said yet"],
  ["listening", "Listening"],
  ["thinking",  "Transcribing"],
  ["review",    "Transcribed — waiting on the Candidate"],
  ["sending",   "Submitting"],
  ["sent",      "Sent (C only: undo window)"],
  ["silent",    "Nothing was heard"],
  ["denied",    "Microphone refused"],
  ["typing",    "Fallback — typing"],
];

/* ============================================================ the chrome === */
function shell(inner, note) {
  return `
  <div class="app">
    <aside class="rail">
      <div class="brand"><span class="brand-mark">I</span> InterviewLM</div>
      <nav class="nav">
        <a href="#"><span class="dot"></span>Mastery</a>
        <a href="#"><span class="dot"></span>Notebook</a>
        <a href="#" aria-current="page"><span class="dot"></span>Session</a>
        <a href="#"><span class="dot"></span>Credits</a>
        <a href="#"><span class="dot"></span>Settings</a>
      </nav>
      <div class="stack g5" style="margin-top:auto">
        <span class="eyebrow">Answering</span>
        <span class="caption">${note}</span>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="stack" style="gap:2px">
          <span class="eyebrow">Question 4 of 8</span>
          <span style="color:var(--fg);font-family:var(--font-display);font-weight:500">Attention · Scaled dot-product</span>
        </div>
        <div class="row g6">
          <span class="plan-dots" aria-label="Plan position">
            <i data-done></i><i data-done></i><i data-done></i><i data-now></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="mono dim">24:11</span>
          <button class="btn btn--ghost btn--sm">End Session</button>
        </div>
      </header>
      <div class="pad">
        <div class="stage">
          <div class="between" style="align-items:baseline">
            <div class="row g4">
              <span class="tag" data-tone="ok">Ground truth</span>
              <span class="tag">weight 1.0</span>
            </div>
            <span class="caption">Graded once, at the end.</span>
          </div>
          <div class="mt6">
            ${TURNS.map((t) => `
              <div class="turn" data-who="${t.who}">
                <span class="turn-who">${t.who === "examiner" ? "Examiner" : "You"}</span>
                <p class="turn-body">${t.body}</p>
              </div>`).join("")}
          </div>
          ${inner}
        </div>
      </div>
    </div>
  </div>`;
}

/* Shared pieces every variant needs identically, so the variants differ only
   where they actually disagree. */
const modeSwitch = (mode) => `
  <span class="modes" role="group" aria-label="How you answer">
    <button aria-pressed="${mode === "speak"}" data-mode="speak">Speak</button>
    <button aria-pressed="${mode === "type"}" data-mode="type">Type</button>
  </span>`;

const loadingBox = (pct) => `
  <div class="vbox" data-busy>
    <div class="load">
      <div class="between">
        <span class="eyebrow">Preparing to listen</span>
        <span class="mono dim">${pct}%</span>
      </div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <p class="caption">
        The model that turns speech into text runs in this browser and never leaves it —
        60MB, once. It is cached after this, so every later Session starts listening
        immediately.
      </p>
    </div>
    <div class="vbox-foot">
      <span class="caption">You do not have to wait.</span>
      <button class="btn btn--sm" data-mode="type">Type this answer instead</button>
    </div>
  </div>`;

const deniedBox = () => `
  <div class="notice" data-tone="risk">
    <span class="notice-ico">${ICO.warn()}</span>
    <span class="grow stack g4">
      <strong style="color:var(--fg)">This browser will not give us the microphone.</strong>
      <span class="caption">
        Nothing is lost — the Session is open and the question is still yours to answer.
        Allow the microphone in the address bar and speak, or type this one.
      </span>
    </span>
  </div>
  <div class="vbox">
    <div class="vbox-main">
      <textarea class="said" placeholder="Explain it as if the follow-up is already coming."></textarea>
    </div>
    <div class="vbox-foot">
      <button class="btn btn--sm">Try the microphone again</button>
      <button class="btn btn--primary btn--sm">Submit answer ${ICO.send()}</button>
    </div>
  </div>`;

const typingBox = () => `
  <div class="vbox">
    <div class="vbox-main">
      <label class="vh" for="answer">Your answer</label>
      <textarea class="said" id="answer" placeholder="Explain it as if the follow-up is already coming.">${SAID}</textarea>
    </div>
    <div class="vbox-foot">
      ${modeSwitch("type")}
      <button class="btn btn--primary btn--sm">Submit answer ${ICO.send()}</button>
    </div>
  </div>
  <p class="kbd">⌘↵ to submit</p>`;

const silentBox = (mic) => `
  <div class="notice" data-tone="warn">
    <span class="notice-ico">${ICO.warn()}</span>
    <span class="grow stack g4">
      <strong style="color:var(--fg)">We heard the room, but no speech.</strong>
      <span class="caption">
        Nothing was sent and the question is unchanged. Check the right microphone
        is selected, then go again.
      </span>
    </span>
  </div>
  ${mic}`;

const engineTag = `<span class="tag" title="WebGPU is available, so transcription runs on the GPU">WebGPU</span>`;
const engineTagFallback = `<span class="tag" data-tone="warn" title="No WebGPU here — running on the CPU, which is slower but works">CPU</span>`;

const privacy = `<span class="caption">Your voice never leaves this browser. Only the text is sent, and only when you send it.</span>`;

/* =========================================================== variant A ====
   SPEAK, THEN READ IT BACK.
   One button, two states. Transcription lands in an editable box and nothing
   goes to the grader until the Candidate agrees it is what they said. */
function variantA(s, t) {
  const note = "Speak. Read it back. Send it.";
  if (s === "loading") return shell(`<div class="composer">${loadingBox(64)}</div>`, note);
  if (s === "denied")  return shell(`<div class="composer">${deniedBox()}</div>`, note);
  if (s === "typing")  return shell(`<div class="composer">${typingBox()}</div>`, note);

  const listening = s === "listening";
  const busy = s === "thinking";
  const has = s === "review" || s === "sending";

  const micBtn = `
    <div class="mic-wrap"${listening ? ` data-live style="--level:${(Math.abs(Math.sin(t)) ).toFixed(2)}"` : ""}>
      <button class="mic mic--lg" data-state="${listening ? "listening" : "idle"}"
              ${busy ? "disabled" : ""} aria-pressed="${listening}"
              aria-label="${listening ? "Stop and transcribe" : "Start speaking"}">
        ${listening ? ICO.stop(26) : ICO.mic(28)}
      </button>
    </div>`;

  if (s === "silent") return shell(`<div class="composer">${silentBox(`
    <div class="vbox">
      <div class="vbox-main">
        <div class="row g7">
          ${micBtn}
          <span class="grow stack g4">
            <span class="h4">Go again when you are ready.</span>
            <span class="caption">The clock on the Session is still running.</span>
          </span>
        </div>
      </div>
    </div>`)}</div>`, note);

  /* Idle and listening are the same object in two states — one control, so
     there is never a question of which button ends the recording. */
  const stage = has ? `
    <div class="vbox">
      <div class="vbox-main stack g6">
        <div class="between">
          <span class="eyebrow">What we heard — yours to fix</span>
          <span class="tag" data-tone="accent">0:38 spoken</span>
        </div>
        <div class="stream" contenteditable="true" role="textbox" aria-label="Your answer, as transcribed">${saidHtml()}</div>
        <span class="caption">
          Two words are underlined because the model was unsure of them. It grades what
          is written here, so a term it misheard is a term you did not say.
        </span>
      </div>
      <div class="vbox-foot">
        <div class="row g5">
          <button class="mic mic--sm" aria-label="Record again">${ICO.redo(17)}</button>
          <span class="caption">Say it again</span>
        </div>
        <button class="btn btn--primary btn--sm" ${s === "sending" ? "disabled" : ""}>
          ${s === "sending" ? "Sending…" : `Submit answer ${ICO.send()}`}
        </button>
      </div>
    </div>`
  : `
    <div class="vbox" ${listening ? "data-live" : ""} ${busy ? "data-busy" : ""}>
      <div class="vbox-main">
        <div class="row g7">
          ${micBtn}
          <span class="grow stack g4">
            ${listening ? `
              <span class="row g6">
                <span class="timer">0:${String(Math.floor(t * 2) % 60).padStart(2, "0")}</span>
                ${levels(22, t, true)}
              </span>
              <span class="caption">Listening. Press again — or ⌘↵ — when you have finished the thought.</span>
            ` : busy ? `
              <span class="h4">Writing down what you said…</span>
              <span class="caption">A few seconds. Nothing has been sent.</span>
            ` : `
              <span class="h4">Answer out loud.</span>
              <span class="caption">Press the button, or hold <b class="mono">Space</b>. You read it back before it goes.</span>
            `}
          </span>
          ${busy ? `<span class="tag" data-tone="accent">transcribing</span>` : ""}
        </div>
      </div>
      <div class="vbox-foot">
        ${modeSwitch("speak")}
        <div class="row g5">${engineTag}${privacy}</div>
      </div>
    </div>`;

  return shell(`<div class="composer">${stage}
    <div class="hint-row">
      <span class="kbd">Space to talk · ⌘↵ to submit</span>
      <span class="kbd">A hint, if the examiner offers one, lowers this answer's weight.</span>
    </div>
  </div>`, note);
}

/* =========================================================== variant B ====
   LIVE DICTATION.
   Inference on a rolling window while they talk, so the words appear as they
   are said. Settled text is solid; the tail the model may still revise is
   dimmed. Same confirmation step at the end as A. */
function variantB(s, t) {
  const note = "Watch the words arrive. Fix them. Send.";
  if (s === "loading") return shell(`<div class="composer">${loadingBox(41)}</div>`, note);
  if (s === "denied")  return shell(`<div class="composer">${deniedBox()}</div>`, note);
  if (s === "typing")  return shell(`<div class="composer">${typingBox()}</div>`, note);

  const listening = s === "listening";
  const busy = s === "thinking";
  const has = s === "review" || s === "sending";

  /* While listening, words land a few at a time — the last clause is dim
     because a chunked model rewrites its own tail. */
  const n = has ? SAID_WORDS.length : Math.min(SAID_WORDS.length, 6 + Math.floor(t * 3) % 30);
  const settled = SAID_WORDS.slice(0, Math.max(0, n - 4));
  const tail = SAID_WORDS.slice(Math.max(0, n - 4), n);

  const body = has
    ? `<div class="stream" contenteditable="true" role="textbox" aria-label="Your answer, as transcribed">${saidHtml()}</div>`
    : listening
      ? `<div class="stream" aria-live="polite">${saidHtml(settled)}
           <span class="prov">${tail.map(([w]) => w).join(" ")}</span><span class="cursor"></span></div>`
      : busy
        ? `<div class="stream">${saidHtml(settled)} <span class="prov">…</span></div>`
        : `<div class="stream"><span class="prov">The words appear here as you say them.</span></div>`;

  if (s === "silent") return shell(`<div class="composer">${silentBox(`
    <div class="vbox"><div class="vbox-main stack g6">
      <div class="stream"><span class="prov">Nothing came through.</span></div>
    </div>
    <div class="vbox-foot">
      <div class="row g5"><button class="mic mic--sm">${ICO.mic(19)}</button><span class="caption">Start again</span></div>
      ${engineTagFallback}
    </div></div>`)}</div>`, note);

  return shell(`<div class="composer">
    <div class="vbox" ${listening ? "data-live" : ""} ${busy ? "data-busy" : ""}>
      <div class="vbox-main stack g6">
        <div class="between">
          <span class="eyebrow">${listening ? "Listening" : has ? "What we heard — yours to fix" : "Ready"}</span>
          <div class="row g5">
            ${listening ? `<span class="timer">0:${String(Math.floor(t * 2) % 60).padStart(2, "0")}</span>` : ""}
            ${listening ? levels(16, t, true) : ""}
            ${busy ? `<span class="tag" data-tone="accent">catching up</span>` : ""}
            ${has ? `<span class="tag" data-tone="accent">0:38 spoken</span>` : ""}
          </div>
        </div>
        ${body}
        ${has ? `<span class="caption">
          The underlined words are the ones the model was least sure of. It grades what is
          written here, not what you remember saying.
        </span>` : listening ? `<span class="caption">
          The dimmed tail is still being decided — it will settle a word or two behind you.
        </span>` : ""}
      </div>
      <div class="vbox-foot">
        ${has ? `
          <div class="row g5">
            <button class="mic mic--sm" aria-label="Record again">${ICO.redo(17)}</button>
            <span class="caption">Say it again</span>
          </div>
          <button class="btn btn--primary btn--sm" ${s === "sending" ? "disabled" : ""}>
            ${s === "sending" ? "Sending…" : `Submit answer ${ICO.send()}`}
          </button>
        ` : `
          <div class="row g5">
            <div class="mic-wrap"${listening ? " data-live" : ""}>
              <button class="mic mic--sm" data-state="${listening ? "listening" : "idle"}" ${busy ? "disabled" : ""}>
                ${listening ? ICO.stop(18) : ICO.mic(19)}
              </button>
            </div>
            ${modeSwitch("speak")}
          </div>
          <div class="row g5">${engineTag}${privacy}</div>
        `}
      </div>
    </div>
    <div class="hint-row">
      <span class="kbd">Space to talk · ⌘↵ to submit</span>
      <span class="kbd">Your voice never leaves this browser.</span>
    </div>
  </div>`, note);
}

/* =========================================================== variant C ====
   SPEAK AND SEND.
   No confirmation step. Stop talking, it transcribes and goes, with a four
   second window to pull it back. This is the one that feels like an interview
   and the one that can send a misheard term to the grader. */
function variantC(s, t) {
  const note = "Stop talking and it goes.";
  if (s === "loading") return shell(`<div class="composer">${loadingBox(88)}</div>`, note);
  if (s === "denied")  return shell(`<div class="composer">${deniedBox()}</div>`, note);
  if (s === "typing")  return shell(`<div class="composer">${typingBox()}</div>`, note);

  const listening = s === "listening";

  if (s === "sent" || s === "sending") return shell(`<div class="composer">
    <div class="turn" data-who="candidate" style="border-bottom:0;opacity:.7">
      <span class="turn-who">You · spoken</span>
      <p class="turn-body">${SAID}</p>
    </div>
    <div class="undo">
      <span class="grow stack g4">
        <strong style="color:var(--fg)">Sent.</strong>
        <span class="caption">Two words were heard with low confidence. Pull it back if they are wrong.</span>
        <span class="meter mt2" style="max-width:220px"><i class="undo-bar"></i></span>
      </span>
      <button class="btn btn--sm">Pull it back and edit</button>
    </div>
  </div>`, note);

  if (s === "review") return shell(`<div class="composer">
    <div class="vbox" data-busy>
      <div class="vbox-main stack g5">
        <span class="eyebrow">Going in 3…</span>
        <div class="stream">${saidHtml()}</div>
      </div>
      <div class="vbox-foot">
        <button class="btn btn--sm">Hold on — let me read it</button>
        <button class="btn btn--primary btn--sm">Send it now ${ICO.send()}</button>
      </div>
    </div>
    <span class="caption">
      A pause of two seconds ends the answer. Nothing is graded until the Session is over,
      but what is sent is what is graded.
    </span>
  </div>`, note);

  if (s === "silent") return shell(`<div class="composer">${silentBox(`
    <div class="vbox"><div class="vbox-main">
      <div class="row g7">
        <div class="mic-wrap"><button class="mic mic--lg">${ICO.mic(28)}</button></div>
        <span class="grow stack g4">
          <span class="h4">Nothing sent. Go again.</span>
          <span class="caption">Silence does not end a turn unless you said something first.</span>
        </span>
      </div>
    </div></div>`)}</div>`, note);

  /* Idle / listening / thinking share one big presence — the point of C is
     that the composer is a conversation partner rather than a form. */
  const label = listening
    ? "Listening — stop when you are done, or just pause"
    : s === "thinking" ? "Writing it down…" : "Answer out loud";

  return shell(`<div class="composer">
    <div class="vbox" ${listening ? "data-live" : ""} ${s === "thinking" ? "data-busy" : ""}>
      <div class="vbox-main">
        <div class="stack g7" style="justify-items:center;text-align:center;padding:var(--s-7) 0">
          <div class="mic-wrap"${listening ? ` data-live style="--level:${Math.abs(Math.sin(t)).toFixed(2)}"` : ""}>
            <button class="mic mic--lg" data-state="${listening ? "listening" : "ready"}"
                    ${s === "thinking" ? "disabled" : ""}>
              ${listening ? ICO.stop(28) : ICO.mic(30)}
            </button>
          </div>
          <div class="stack g4" style="justify-items:center">
            <span class="h4">${label}</span>
            <span class="caption" style="max-width:44ch">
              ${listening
                ? "Two seconds of quiet ends the answer and sends it. You get four seconds to pull it back."
                : s === "thinking" ? "Nothing has been sent yet."
                : "It sends itself when you stop. Everything is transcribed here, in this browser."}
            </span>
          </div>
          ${listening ? `<div class="row g6"><span class="timer">0:${String(Math.floor(t * 2) % 60).padStart(2, "0")}</span>${levels(30, t, true)}</div>` : ""}
        </div>
      </div>
      <div class="vbox-foot">
        ${modeSwitch("speak")}
        <div class="row g5">${engineTag}${privacy}</div>
      </div>
    </div>
    <div class="hint-row">
      <span class="kbd">Space to talk · Esc to discard</span>
      <span class="kbd">Sends on a two-second pause.</span>
    </div>
  </div>`, note);
}

/* --------------------------------------------------------------- render -- */
const VARIANTS = {
  A: { name: "Speak, then read it back", fn: variantA },
  B: { name: "Live dictation", fn: variantB },
  C: { name: "Speak and send", fn: variantC },
};
const KEYS = Object.keys(VARIANTS);
let variant = "A";
let state = "idle";
let t = 0;

document.getElementById("states").innerHTML =
  `<b>State</b>` + STATES.map(([k, label], i) =>
    `<button data-state="${k}" data-i="${i + 1}"><span class="n">${(i + 1) % 10}</span>${label}</button>`
  ).join("");

function render() {
  document.getElementById("root").innerHTML = VARIANTS[variant].fn(state, t);
  document.getElementById("lbl").textContent = `${variant} — ${VARIANTS[variant].name}`;
  document.querySelectorAll("#states button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.state === state)));
}
function setVariant(k) {
  variant = k;
  const u = new URL(location.href);
  u.searchParams.set("variant", k);
  history.replaceState({}, "", u);
  render();
}
function setState(k) { state = k; render(); }

const cycle = (step) => setVariant(KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length]);
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("states").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-state]");
  if (b) setState(b.dataset.state);
});

/* The mic button in the mock is live enough to walk the states by hand. */
document.getElementById("root").addEventListener("click", (e) => {
  if (e.target.closest("[data-mode='type']")) return setState("typing");
  if (e.target.closest("[data-mode='speak']")) return setState("idle");
  if (!e.target.closest(".mic")) return;
  if (state === "listening") return setState(variant === "C" ? "review" : "thinking");
  setState("listening");
});

addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && (/^(INPUT|TEXTAREA)$/.test(el.tagName) || el.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  const n = Number(e.key);
  if (Number.isInteger(n)) {
    const idx = n === 0 ? 9 : n - 1;
    if (STATES[idx]) setState(STATES[idx][0]);
  }
});

/* Only the live states animate, so a still screenshot of the rest is stable. */
setInterval(() => {
  if (state !== "listening" && state !== "thinking") return;
  t += 0.12;
  render();
}, 90);

const url = new URL(location.href);
const asked = url.searchParams.get("variant");
variant = KEYS.includes(asked) ? asked : "A";
const askedState = url.searchParams.get("state");
if (STATES.some(([k]) => k === askedState)) state = askedState;
render();
</script>
</body>
</html>
